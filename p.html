<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>♡Happy birthday♡</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
  margin: 0;
  min-height: 100svh;

  font-family: Arial, sans-serif;
  color: #333;
  text-align: center;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;
  box-sizing: border-box;

  background-color: #ffd6e0;
  background-image: url(background.png);
  background-repeat: no-repeat;
  background-position: center center;
  background-size: cover;
  background-attachment: fixed;

  overflow-x: hidden;
}

    h1 {
      font-size: 1.8em;
      color: #d47676;
      margin: 20px 0;
      line-height: 1.3;
    }

    .card {
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      display: inline-block;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      animation: fadeIn 2s ease-in-out;
      max-width: 90%;
      width: 400px;
      box-sizing: border-box;
    }

    .container img {
      width: 100%;
      max-width: 200px;
      height: auto;
      border-radius: 10px;
      margin-bottom: 5px;
    }

    .buttons-wrap {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background-color: #d47676;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1em;
      box-sizing: border-box;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: nowrap;
      transition: background-color 0.3s ease, transform 0.15s ease;
    }

    .btn:hover {
      background-color: #c05c5c;
    }

    .btn:active {
      transform: scale(0.97);
    }

    @media (max-width: 600px) {
  body {
    padding: 10px;
  }

  h1 {
    font-size: 1.4em;
  }

  .card {
    padding: 25px 20px;
    width: 100%;
  }

  .container img {
    max-width: 150px;
  }

  .btn {
    padding: 10px 18px;
    font-size: 0.95em;
  }
}
      h1 {
        font-size: 1.4em;
      }

      .card {
        padding: 25px 20px;
        width: 100%;
      }

      .container img {
        max-width: 150px;
      }

      .btn {
        padding: 10px 18px;
        font-size: 0.95em;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="container">
      <img src="cat_sad.png" alt="грустный котик">
    </div>

    <h1>Подумай хорошенько кись (￢_￢;)</h1>

    <div class="buttons-wrap">
      <a href="index.html" class="btn">Вернуться к письму</a>
    </div>
  </div>
</body>
</html>
